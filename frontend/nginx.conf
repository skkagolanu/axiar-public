server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: any path not matching a real file resolves to index.html so
    # react-router-dom's client-side routes (e.g. /dashboard/jobs) work on a hard
    # refresh or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
