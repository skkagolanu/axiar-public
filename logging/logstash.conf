input {
  tcp {
    port => 5000
    codec => json
  }
  beats {
    port => 5044
  }
}

filter {
  if [type] == "backend" {
    json {
      source => "message"
    }
    mutate {
      add_field => { "service" => "axiar-backend" }
    }
  }

  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => ["alert"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "axiar-logs-%{+YYYY.MM.dd}"
  }
  
  if "alert" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}
