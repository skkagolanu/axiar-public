apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiar-backend
  labels:
    app: axiar-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: axiar-backend
  template:
    metadata:
      labels:
        app: axiar-backend
    spec:
      containers:
      - name: axiar-backend
        image: axiar/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: axiar-config
              key: redis-url
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: axiar-config
              key: kafka-servers
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: secret-key
        - name: SESSION_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: session-secret-key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: stripe-webhook-secret
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: sendgrid-api-key
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: twilio-auth-token
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: twilio-phone-number
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: google-maps-api-key
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: google-client-secret
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: microsoft-client-id
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: microsoft-client-secret
        - name: VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: vapid-public-key
              optional: true
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: vapid-private-key
              optional: true
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: axiar-secrets
              key: sentry-dsn
              optional: true
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: axiar-config
              key: environment
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
