# Template for the `axiar-secrets` Secret consumed by deployment.yaml / postgres.yaml.
#
# DO NOT apply this file directly and DO NOT commit a filled-in copy — it is a reference
# for the keys Settings (backend/app/core/config.py) requires, not a deployable manifest
# (it is intentionally NOT listed in kustomization.yaml's resources).
#
# Recommended paths to create the real Secret:
#   1. Dev/local:  kubectl create secret generic axiar-secrets --from-literal=... (see k8s/README.md)
#   2. Production:  External Secrets Operator syncing from your secret store (Vault, AWS
#      Secrets Manager, GCP Secret Manager, ...) using this key list as the field mapping —
#      never hand-apply real values to a cluster from a local file.
apiVersion: v1
kind: Secret
metadata:
  name: axiar-secrets
type: Opaque
stringData:
  # --- Database / auth core (required, no default in Settings — pod crash-loops without these) ---
  database-url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/axiar"
  postgres-user: "CHANGE_ME"
  postgres-password: "CHANGE_ME"
  secret-key: "CHANGE_ME"                    # >=32 chars, unique per environment — use a consistent signing key across workers
  session-secret-key: "CHANGE_ME"

  # --- Stripe (required) ---
  stripe-secret-key: "CHANGE_ME"
  stripe-webhook-secret: "CHANGE_ME"

  # --- SendGrid / Twilio (required) ---
  sendgrid-api-key: "CHANGE_ME"
  twilio-account-sid: "CHANGE_ME"
  twilio-auth-token: "CHANGE_ME"
  twilio-phone-number: "CHANGE_ME"

  # --- Google Maps + OAuth (required) ---
  google-maps-api-key: "CHANGE_ME"
  google-client-id: "CHANGE_ME"
  google-client-secret: "CHANGE_ME"
  microsoft-client-id: "CHANGE_ME"
  microsoft-client-secret: "CHANGE_ME"

  # --- Optional (Settings defaults to empty/mock-mode when unset) ---
  vapid-public-key: ""
  vapid-private-key: ""
  sentry-dsn: ""
