#
# Built WITHOUT a VITE_API_URL build-arg (or built with it empty) so axios's baseURL
# defaults to '' -- same-origin requests. That only works because the Ingress below
# serves both the SPA and the backend API under one host (axiar.example.test), so "/api/v1/..."
# resolves relative to wherever the SPA itself was served from -- no CORS, no
# cross-origin cookies, no separate frontend-specific origin config needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiar-frontend
  labels:
    app: axiar-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axiar-frontend
  template:
    metadata:
      labels:
        app: axiar-frontend
    spec:
      containers:
      - name: axiar-frontend
        image: axiar/frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: axiar-frontend
  labels:
    app: axiar-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: axiar-frontend
