apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiar-backend
spec:
  template:
    spec:
      containers:
      - name: axiar-backend
        image: axiar/backend:v2.0.0
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
